# ============================================================
# application-prod.properties — WalletLedger (Produção)
# ============================================================
# Configurações NÃO-SENSÍVEIS de produção.
# SEGREDOS (senhas, chaves, URLs) vêm de VARIÁVEIS DE AMBIENTE na Render.
# Spring Boot mescla este arquivo + env vars (env vars vencem).
# ============================================================

# -----------------------------------------------------------------------------
# JPA / Hibernate / Flyway
# -----------------------------------------------------------------------------
# validate: falha no startup se schema do Flyway não bater com as entidades
# (evita drift silencioso entre migrações e código)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false  # Desliga OSIV — use DTOs/projeções nos controllers

# Flyway: garante que migrações rodem no startup (default: true)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true  # Permite baseline se banco já tiver tabelas
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Connection Pool (HikariCP) — otimizado para container com RAM limitada
# -----------------------------------------------------------------------------
# maximumPoolSize: ajustado para o plano da Render (ex.: 512MB RAM -> ~8-10 conexões)
# minimumIdle: mantém poucas conexões quentes para latência baixa
# connectionTimeout: 30s para pegar conexão do pool
# idleTimeout: 10min — libera conexões ociosas
# maxLifetime: 30min — renova conexões para evitar problemas de rede/stateful firewall
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=WalletLedgerHikariPool
# Propriedades de validação de conexão (evita "stale connections")
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# -----------------------------------------------------------------------------
# Logging — JSON estruturado para observabilidade (Grafana Loki, Datadog, etc.)
# -----------------------------------------------------------------------------
# Pattern JSON com: timestamp, level, logger, thread, message, exception
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
# Para JSON puro, descomente a linha abaixo e comente a acima:
# logging.pattern.console={"timestamp": "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}", "level": "%p", "logger": "%logger{39}", "thread": "%thread", "message": "%m", "exception": "%ex"}

logging.level.root=INFO
logging.level.com.API.walletLedger=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.flywaydb=INFO

# -----------------------------------------------------------------------------
# Server / Tomcat
# -----------------------------------------------------------------------------
# A Render injeta PORT via env var; o Dockerfile já lê ${PORT:-8080}
# Estas configs otimizam thread pool do Tomcat para container
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/xml,text/plain,application/xml,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# -----------------------------------------------------------------------------
# Actuator / Health Checks (para Render monitorar)
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# -----------------------------------------------------------------------------
# Worker de liquidação (Fase 3.1 — B2b)
# -----------------------------------------------------------------------------
# Valores podem ser sobrescritos por env vars na Render se necessário
wallet.worker.poll-interval-ms=10000
wallet.worker.settle-after-seconds=30

# -----------------------------------------------------------------------------
# OpenAPI / Swagger (opcional — descomente se quiser expor em prod)
# -----------------------------------------------------------------------------
# springdoc.api-docs.enabled=true
# springdoc.swagger-ui.enabled=true
# springdoc.swagger-ui.path=/swagger-ui.html