spring.application.name=walletLeger
spring.datasource.url=jdbc:postgresql://localhost:5432/walletledger
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# JWT Configuration
# Chave HMAC-SHA256 codificada em Base64 (256 bits mínimos para HS256)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tempo de expiração: 24 horas (em milissegundos: 86400000 ms)
jwt.expiration-ms=86400000

# Webhook do provedor de pagamento (Fase 3.1)
# Segredo compartilhado enviado no header X-Webhook-Secret.
# Em produção NUNCA fica versionado: vem de variável de ambiente/secrets manager
# e o ideal é assinatura HMAC-SHA256 do corpo da requisição.
wallet.webhook.secret=dev-webhook-secret-local